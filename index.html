      var userEvents = ['scroll', 'pointerdown', 'touchstart', 'keydown'];
      function onFirstUserInteraction() {
        initTracking();
        userEvents.forEach(function(evt) {
          window.removeEventListener(evt, onFirstUserInteraction);
        });
      }
      userEvents.forEach(function(evt) {
        window.addEventListener(evt, onFirstUserInteraction, { passive: true, once: true });
      });

      if ('requestIdleCallback' in window) {
        requestIdleCallback(initTracking, { timeout: 3500 });
      } else {

    <script>
      /* WebMCP (Web Model Context Protocol) Imperative & Polyfill Engine for AI Agents */
      (function() {
        const webMcpTools = [
          {
            name: "request_project_quote",
            description: "Submit project specifications to calculate timeline and cost quote for custom web, mobile, AI or ERP/CRM development.",
            inputSchema: {
              type: "object",
              properties: {
                name: { type: "string", description: "Contact person or company name" },
                email: { type: "string", format: "email", description: "Contact email address" },
                service: { type: "string", description: "Requested service category" },
                budget: { type: "string", description: "Target project budget" },
                details: { type: "string", description: "Project scope and specifications" }
              },
              required: ["email", "service"]
            },
            execute: async function(args) {
              window.location.href = "/get-a-free-quote";
              return { status: "redirected", url: "/get-a-free-quote", args: args };
            }
          },
          {
            name: "schedule_consultation",
            description: "Book an engineering architecture and strategy consultation with NovaDesk specialists.",
            inputSchema: {
              type: "object",
              properties: {
                name: { type: "string", description: "Contact person name" },
                email: { type: "string", format: "email", description: "Contact email" },
                notes: { type: "string", description: "Inquiry or consultation details" }
              },
              required: ["email"]
            },
            execute: async function(args) {
              window.location.href = "/contact-us";
              return { status: "redirected", url: "/contact-us", args: args };
            }
          },
          {
            name: "read_llm_documentation",
            description: "Retrieve comprehensive Markdown documentation of NovaDesk services, tech stack, and case studies.",
            inputSchema: {
              type: "object",
              properties: {
                fullContext: { type: "boolean", description: "Whether to return full deep documentation" }
              }
            },
            execute: async function(args) {
              const target = (args && args.fullContext) ? "/llms-full.txt" : "/llms.txt";
              const res = await fetch(target);
              return { content: await res.text() };
            }
          }
        ];

        async function initWebMcp() {
          const mc = (typeof navigator !== 'undefined' && navigator.modelContext) || 
                     (typeof document !== 'undefined' && document.modelContext);
          if (mc && typeof mc.registerTool === 'function') {
            for (const tool of webMcpTools) {
              try {
                await mc.registerTool(tool);
              } catch (e) {}
            }
          }
          window.__MODEL_CONTEXT__ = {
            name: "NovaDesk AI & Engineering Platform",
            description: "Premier AI, mobile, web, and custom ERP/CRM engineering agency.",
            llmsTxt: "/llms.txt",
            tools: webMcpTools
          };
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initWebMcp);
        } else {
          initWebMcp();
        }
      })();
    </script>
